<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; background: #0b0e15; color: #e8eaf0;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace; overflow: hidden; }
  .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; box-sizing: border-box; gap: 10px; }
  .hud {
    background: linear-gradient(160deg, rgba(22,26,38,.9), rgba(12,14,22,.95));
    border: 1px solid rgba(122, 162, 247, .35); border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
  }
  .phase { font-size: 13px; font-weight: 700; color: #9ecbff; letter-spacing: .4px; }
  .state { margin-top: 4px; color: #b9c2d4; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rows { margin-top: 8px; display: grid; gap: 6px; }
  .row .lbl { display: flex; justify-content: space-between; color: #8f98ad; font-size: 10px; margin-bottom: 2px; }
  .row .bar { height: 5px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
  .row .bar .fill { height: 100%; width: 0; background: linear-gradient(90deg, #4f9dff, #7d5cff); transition: width .45s ease; }
  .row .bar .fill.err { background: linear-gradient(90deg, #ff5d5d, #ff8a5c); }
  .events { margin-top: 8px; display: grid; gap: 3px; max-height: 150px; overflow: hidden; }
  .events .ev { color: #7f88a0; font-size: 10px; }
  .cast { flex: 1; display: flex; align-items: flex-end; justify-content: space-around; gap: 8px; }
  .agent-sprite { width: 130px; height: auto; image-rendering: pixelated; pointer-events: none;
    border-radius: 12px; background: rgba(255,255,255,.05); padding: 6px; }
  .mg-ball { position: fixed; background: rgba(20,22,28,.96); border: 1px solid rgba(255,255,255,.25);
    border-radius: 12px; padding: 8px 12px; color: #e8eaf0; font-size: 11px; line-height: 1.45;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); z-index: 10; pointer-events: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="phase" id="phase">menagerie</div>
    <div class="state" id="state">◌ connecting…</div>
    <div class="rows" id="rows"></div>
    <div class="events" id="events"></div>
  </div>
  <div class="cast" id="cast"></div>
</div>
<script src="panel.js"></script>
</body>
</html>
