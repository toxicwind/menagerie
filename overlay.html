<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>session-move overlay</title>
<style>
  :root { --fg:#e8ecf4; --muted:#8b94a7; --accent:#6ee7b7; --warn:#fbbf24; --err:#f87171; --glass:rgba(18,22,30,.55); }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; padding: 3rem 2.5rem;
    font: 14px/1.5 "SF Mono", "Cascadia Code", monospace; color: var(--fg);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(110,231,183,.14), transparent 60%),
      radial-gradient(1000px 500px at -10% 110%, rgba(251,191,36,.10), transparent 55%),
      linear-gradient(160deg, #0b0e14, #0e1320);
  }
  .hud { max-width: 860px; margin: 0 auto; backdrop-filter: blur(22px); background: var(--glass);
    border: 1px solid rgba(255,255,255,.09); border-radius: 22px; padding: 2rem 2.2rem;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); }
  h1 { font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .phase { font-size: 26px; font-weight: 700; margin: .7rem 0 1.4rem; }
  .phase .dot { color: var(--accent); }
  .rows { display: grid; gap: .9rem; }
  .row { display: grid; gap: .4rem; }
  .lbl { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; }
  .bar { height: 9px; border-radius: 99px; background: rgba(255,255,255,.06); overflow: hidden; }
  .fill { height: 100%; width: 0%; border-radius: 99px; transition: width .35s cubic-bezier(.22,.9,.34,1);
    background: linear-gradient(90deg, #34d399, #6ee7b7); box-shadow: 0 0 14px rgba(110,231,183,.55); }
  .fill.err { background: linear-gradient(90deg,#f87171,#fb923c); box-shadow: 0 0 14px rgba(248,113,113,.5); }
  .events { margin-top: 1.6rem; border-top: 1px solid rgba(255,255,255,.07); padding-top: 1rem; display: grid; gap: .3rem; }
  .ev { color: var(--muted); font-size: 12px; animation: in .3s ease; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev b { color: var(--accent); font-weight: 600; }
  @keyframes in { from { opacity: 0; transform: translateY(-3px); } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<div class="hud">
  <h1>session-move · firefox → chrome <span id="state" class="pulse">◌ waiting</span></h1>
  <div class="phase"><span class="dot">▸</span> <span id="phase">booting</span></div>
  <div class="rows" id="rows"></div>
  <div class="events" id="events"></div>
</div>
<script src="/clippy/extras/jquery.min.js"></script>
<script src="/clippy/build/clippy.min.js"></script>
<script>
  const q = s => document.querySelector(s);
  const barFor = (label, key, color) => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<div class="lbl"><span>${label}</span><span class="pct">0%</span></div><div class="bar"><div class="fill" id="fill-${key}"></div></div>`;
    q("rows").appendChild(row); return row;
  };
  const ev = (txt) => { const d = document.createElement("div"); d.className = "ev"; d.innerHTML = txt; q("events").prepend(d); while (q("events").children.length > 12) q("events").lastElementChild.remove(); };
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = (m) => {
    const s = JSON.parse(m.data);
    q("phase").textContent = s.phase || q("phase").textContent;
    q("state").textContent = s.state || "";
    for (const [k, v] of Object.entries(s.bars || {})) {
      let f = $("fill-" + k);
      if (!f) { barFor(k, k); f = $("fill-" + k); }
      f.style.width = v.pct + "%"; f.closest(".row").querySelector(".pct").textContent = v.pct + "%";
      f.className = "fill" + (v.err ? " err" : "");
    }
    if (s.event) ev(s.event);
  };
  ws.onopen = () => q("state").textContent = "◉ live";
  // ——— menagerie buddy mode: Clippy + Bonzi side by side ———
  const buddy = ({ name, side, hostId }) => {
    const host = document.createElement("div");
    host.id = hostId;
    host.style.cssText = `position:fixed;bottom:${side === "left" ? "18px" : "18px"};${side}:18px;z-index:9999;width:180px;height:180px;pointer-events:none`;
    document.body.appendChild(host);
    window.clippy.BASE_PATH = `/clippy/agents/`;
    window.clippy.load(name, host);
    return new Promise((res) => {
      const t0 = Date.now();
      const iv = setInterval(() => {
        if (host.querySelector("canvas") || host.querySelector("img")) { clearInterval(iv); res(host); }
        else if (Date.now() - t0 > 15000) { clearInterval(iv); res(null); }
      }, 300);
    });
  };
  (async () => {
    const agents = await Promise.all([
      buddy({ name: "Clippy", side: "left", hostId: "buddy-clippy" }),
      buddy({ name: "Bonzi", side: "right", hostId: "buddy-bonzi" }),
    ]);
    const [c, b] = agents;
    if (!c && !b) return;
    window.__speak = (who, txt) => {
      const h = who === "clippy" ? c : b;
      if (!h) return;
      const x = h.closest ? h : h;
      // show balloon via a tiny overlay div on the host
      let balloon = document.getElementById("ball-" + who);
      if (!balloon) {
        balloon = document.createElement("div");
        balloon.id = "ball-" + who;
        balloon.style.cssText = "position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:rgba(20,22,28,.92);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:10px 14px;color:#e8eaf0;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.5)";
        h.appendChild(balloon);
      }
      balloon.textContent = txt;
      setTimeout(() => (balloon.textContent = ""), 6000);
    };
    const oldEv = ws.onmessage;
    ws.onmessage = (m) => {
      oldEv(m);
      const s = JSON.parse(m.data);
      if (s.event) {
        const txt = s.event.replace(/<[^>]+>/g, "");
        if (s.phase === "done") { __speak("clippy", "Done! 🖇️"); window.clippy && c && c.animate("Congratulate"); }
        else if (Math.random() < 0.5) { __speak("clippy", txt.slice(0, 90)); c && c.animate("GestureDown"); }
        else { __speak("bonzi", txt.slice(0, 90)); b && b.animate("GestureUp"); }
      }
    };
  })();
</script>
</body>
</html>
